name: CI

# PR 只检查；main 的 push 或 workflow_dispatch 在检查通过后部署站点。
on:
    pull_request:
    push:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    # PR 更新时取消旧检查，生产部署则允许当前运行完成。
    # 连续推送时，只保留一个等待中的运行，新运行会替换旧的等待项。
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    site:
        # 配置分支保护时，检查名称为 site / verify。
        uses: allurx/allurx-build/.github/workflows/cloudflare-static-site.yml@f3cd85d5d435fb3093ad3c027f6788923aa802e7 # workflows-v2.0.0
        secrets: inherit
        with:
            # npm run verify 的输出目录，其中的文件会公开发布。
            asset-directory: dist/
            # GitHub 部署记录中的站点链接；填写这里不会自动配置域名。
            production-url: https://blog.allurx.io
