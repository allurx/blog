name: CI

# PR 只检查；推送 main 会在检查通过后部署站点。
on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    # PR 更新时取消旧检查，生产部署则允许当前运行完成。
    # 连续推送时，只保留一个等待中的运行，新运行会替换旧的等待项。
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    site:
        # 配置分支保护时，检查名称为 site / verify。
        uses: allurx/web-foundation/.github/workflows/static-site.yml@v1.0.1
        secrets:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
            # npm run verify 的输出目录，其中的文件会公开发布。
            asset-directory: dist/
            # GitHub 部署记录中的站点链接；填写这里不会自动配置域名。
            production-url: https://blog.allurx.io
