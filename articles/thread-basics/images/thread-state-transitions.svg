<svg xmlns="http://www.w3.org/2000/svg" width="940" height="555" viewBox="0 0 940 555" role="img" aria-labelledby="title"><title id="title">Java线程六种状态及不同等待操作的返回条件</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#35637d"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#172f43"><text x="470" y="39" font-size="24" text-anchor="middle">Java 线程状态：API 条件与返回路径</text><rect x="30" y="75" width="200" height="64" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="130" y="113" font-size="19" text-anchor="middle">NEW</text><rect x="365" y="75" width="220" height="64" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="475" y="113" font-size="19" text-anchor="middle">RUNNABLE</text><rect x="710" y="75" width="200" height="64" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="810" y="113" font-size="19" text-anchor="middle">TERMINATED</text><path d="M235,106 L350,106" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="294" y="94" font-size="16" text-anchor="middle">start</text><path d="M593,106 L700,106" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="646" y="94" font-size="16" text-anchor="middle">执行结束</text><rect x="30" y="214" width="270" height="56" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="165" y="248" font-size="19" text-anchor="middle">BLOCKED</text><rect x="335" y="214" width="270" height="56" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="470" y="248" font-size="19" text-anchor="middle">WAITING</text><rect x="640" y="214" width="270" height="56" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="775" y="248" font-size="19" text-anchor="middle">TIMED_WAITING</text><path d="M475,145 L475,158" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="179" font-size="15" text-anchor="middle">无法继续执行时，按等待原因进入以下状态</text><text x="165" y="306" font-size="16" text-anchor="middle">等待获取或重新获取监视器</text><text x="470" y="306" font-size="16" text-anchor="middle">wait / join / park</text><text x="775" y="306" font-size="16" text-anchor="middle">sleep / 定时等待</text><text x="470" y="360" font-size="19" text-anchor="middle">恢复到 RUNNABLE 的条件取决于具体 API：</text><text x="48" y="404" font-size="18" text-anchor="start">• BLOCKED：成功获取监视器。</text><text x="48" y="440" font-size="18" text-anchor="start">• wait：收到通知、中断或虚假唤醒后，还须重新获取监视器，期间可能 BLOCKED。</text><text x="48" y="476" font-size="18" text-anchor="start">• join、park、sleep 等：按完成、许可、中断或超时规则返回，不共享同一种恢复路径。</text><text x="470" y="526" font-size="16" text-anchor="middle">RUNNABLE 包含正在执行与等待 CPU 的线程；这些是 JVM 状态，不是操作系统状态表。</text></g></svg>
