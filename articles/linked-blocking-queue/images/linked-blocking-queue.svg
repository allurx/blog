<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title"><title id="title">LinkedBlockingQueue哨兵与有效元素链表</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#35637d"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#172f43"><text x="450" y="40" font-size="24" text-anchor="middle">LinkedBlockingQueue：head 是不持有元素的哨兵</text><text x="130" y="94" font-size="20" text-anchor="middle">head</text><path d="M130,106 L130,145" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="705" y="94" font-size="20" text-anchor="middle">last</text><path d="M705,106 L705,145" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="155" width="170" height="70" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="130" y="196" font-size="19" text-anchor="middle">item = null</text><rect x="320" y="155" width="170" height="70" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="405" y="196" font-size="19" text-anchor="middle">item = A</text><rect x="620" y="155" width="170" height="70" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="705" y="196" font-size="19" text-anchor="middle">item = B</text><path d="M215,190 L305,190" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="258" y="174" font-size="16" text-anchor="middle">next</text><path d="M490,190 L605,190" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="548" y="174" font-size="16" text-anchor="middle">next</text><path d="M790,190 L845,190" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="862" y="196" font-size="16" text-anchor="middle">null</text><text x="130" y="257" font-size="18" text-anchor="middle">哨兵节点</text><text x="405" y="257" font-size="18" text-anchor="middle">第一个有效元素</text><text x="705" y="257" font-size="18" text-anchor="middle">最后一个有效元素</text><text x="450" y="306" font-size="17" text-anchor="middle">空队列：head == last，且 head.item == null。取出后，新 head 的 item 被清空。</text></g></svg>
