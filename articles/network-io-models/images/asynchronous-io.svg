<svg xmlns="http://www.w3.org/2000/svg" width="900" height="512" viewBox="0 0 900 512" role="img" aria-labelledby="title"><title id="title">异步 I/O：提交操作后通过完成通知取得结果</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#35637d"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#172f43"><text x="450" y="36" font-size="22" text-anchor="middle">异步 I/O：提交操作后通过完成通知取得结果</text><rect x="64" y="60" width="250" height="48" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="189" y="90" font-size="19" text-anchor="middle">应用</text><rect x="585" y="60" width="250" height="48" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="710" y="90" font-size="19" text-anchor="middle">异步执行机制</text><path d="M189,116 V452 M710,116 V452" stroke="#a8bbc9" stroke-dasharray="6 6"/><text x="450" y="136" font-size="17" text-anchor="middle">提交读取与目标缓冲区</text><path d="M203,148 L696,148" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="219" font-size="17" text-anchor="middle">提交返回，应用继续工作</text><path d="M696,231 L203,231" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="289" width="250" height="48" rx="9" fill="#eef4e8" stroke="#7393a8"/><text x="710" y="319" font-size="19" text-anchor="middle">等待数据并完成读取</text><text x="450" y="385" font-size="17" text-anchor="middle">完成通知与操作结果</text><path d="M696,397 L203,397" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="492" font-size="15" text-anchor="middle">这里是完成语义示意；Java 异步通道不保证在所有平台映射到同一种内核机制。</text></g></svg>
