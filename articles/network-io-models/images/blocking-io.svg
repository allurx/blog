<svg xmlns="http://www.w3.org/2000/svg" width="900" height="512" viewBox="0 0 900 512" role="img" aria-labelledby="title"><title id="title">阻塞读取：等待数据并完成读取后才返回</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#35637d"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#172f43"><text x="450" y="36" font-size="22" text-anchor="middle">阻塞读取：等待数据并完成读取后才返回</text><rect x="64" y="60" width="250" height="48" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="189" y="90" font-size="19" text-anchor="middle">调用线程</text><rect x="585" y="60" width="250" height="48" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="710" y="90" font-size="19" text-anchor="middle">操作系统接口</text><path d="M189,116 V452 M710,116 V452" stroke="#a8bbc9" stroke-dasharray="6 6"/><text x="450" y="136" font-size="17" text-anchor="middle">read</text><path d="M203,148 L696,148" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="206" width="250" height="48" rx="9" fill="#eef4e8" stroke="#7393a8"/><text x="710" y="236" font-size="19" text-anchor="middle">等待数据、结束或错误</text><rect x="585" y="289" width="250" height="48" rx="9" fill="#eef4e8" stroke="#7393a8"/><text x="710" y="319" font-size="19" text-anchor="middle">完成本次读取</text><text x="450" y="385" font-size="17" text-anchor="middle">字节数、EOF 或错误</text><path d="M696,397 L203,397" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="492" font-size="15" text-anchor="middle">等待的是调用线程；不能据此认为整个进程停止或线程始终在内核中睡眠。</text></g></svg>
