<svg xmlns="http://www.w3.org/2000/svg" width="900" height="595" viewBox="0 0 900 595" role="img" aria-labelledby="title"><title id="title">信号驱动 I/O：信号通知状态，应用再读取</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#35637d"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#172f43"><text x="450" y="36" font-size="22" text-anchor="middle">信号驱动 I/O：信号通知状态，应用再读取</text><rect x="64" y="60" width="250" height="48" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="189" y="90" font-size="19" text-anchor="middle">调用线程</text><rect x="585" y="60" width="250" height="48" rx="9" fill="#e4f0f4" stroke="#7393a8"/><text x="710" y="90" font-size="19" text-anchor="middle">操作系统接口</text><path d="M189,116 V535 M710,116 V535" stroke="#a8bbc9" stroke-dasharray="6 6"/><text x="450" y="136" font-size="17" text-anchor="middle">配置所有者、O_ASYNC 与信号处理</text><path d="M203,148 L696,148" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="219" font-size="17" text-anchor="middle">配置返回，应用继续工作</text><path d="M696,231 L203,231" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="302" font-size="17" text-anchor="middle">SIGIO：相关状态发生变化</text><path d="M696,314 L203,314" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="385" font-size="17" text-anchor="middle">按信号安全约束安排非阻塞读取</text><path d="M203,397 L696,397" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="468" font-size="17" text-anchor="middle">实际 I/O 结果</text><path d="M696,480 L203,480" fill="none" stroke="#35637d" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="575" font-size="15" text-anchor="middle">只调用 sigaction 不会自动启用 SIGIO；信号可能合并，通知后状态也可能改变。</text></g></svg>
